<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FTP SFTP Teleport Config</title>
    <style>
        body {
            font-family: var(--vscode-font-family, Arial, sans-serif);
            padding: 24px;
            color: var(--vscode-foreground);
            background: var(--vscode-editor-background);
        }
        h1 { margin-top: 0; font-size: 20px; }
        p { font-size: 13px; line-height: 1.4; opacity: 0.9; }
        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 620px;
        }
        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .field.hidden { display: none; }
        .field label {
            font-size: 13px;
            font-weight: 600;
        }
        .field input,
        .field select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid var(--vscode-input-border);
            background: var(--vscode-input-background);
            color: var(--vscode-input-foreground);
            border-radius: 2px;
        }
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            margin-top: 4px;
        }
        .checkbox-row input { width: auto; }
        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 10px;
        }
        button {
            padding: 8px 16px;
            font-size: 13px;
            cursor: pointer;
            border: 1px solid var(--vscode-button-border, transparent);
            background: var(--vscode-button-background);
            color: var(--vscode-button-foreground);
            border-radius: 2px;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 16px;
            white-space: pre-wrap;
            font-size: 13px;
            min-height: 1.2em;
        }
        #status.ok { color: var(--vscode-terminal-ansiGreen); }
        #status.error { color: var(--vscode-terminal-ansiRed); }
        #loader { display: none; margin-top: 16px; }
        .progress-outer {
            display: inline-block;
            border: 2px solid;
            border-color: #808080 #ffffff #ffffff #808080;
            background: #c0c0c0;
            padding: 4px;
        }
        .progress-bar {
            display: flex;
            width: 240px;
            height: 20px;
            background: #c0c0c0;
        }
        .progress-block {
            flex: 1;
            height: 100%;
            background: #c0c0c0;
            border-right: 1px solid #808080;
            border-bottom: 1px solid #808080;
        }
        .progress-block.active {
            background: #000080;
        }
        .progress-label {
            margin-top: 6px;
            font-size: 13px;
            font-family: var(--vscode-font-family, monospace);
        }
    </style>
</head>
<body>
    <h1>FTP SFTP Teleport Config</h1>
    <p>1. Select mode, fill the fields and click Save. 2. Login or Test as needed. 3. Sync or Dry Run.</p>
    <form id="config-form">
        <div class="field">
            <label for="mode">Connection Mode</label>
            <select id="mode">
                <option value="teleport">Teleport</option>
                <option value="sftp">SFTP (SSH)</option>
                <option value="ftp">FTP</option>
            </select>
        </div>
        <div class="field" data-mode="teleport"><label for="teleportHost">Teleport Host</label><input type="text" id="teleportHost" placeholder="teleport.example.com:3080"></div>
        <div class="field" data-mode="teleport"><label for="teleportUser">Teleport User</label><input type="text" id="teleportUser"></div>
        <div class="field" data-mode="teleport"><label for="teleportCluster">Teleport Cluster</label><input type="text" id="teleportCluster" placeholder="main"></div>
        <div class="field" data-mode="sftp"><label for="sftpHost">SFTP Host</label><input type="text" id="sftpHost"></div>
        <div class="field" data-mode="sftp"><label for="sftpUser">SFTP User</label><input type="text" id="sftpUser"></div>
        <div class="field" data-mode="ftp"><label for="ftpHost">FTP Host</label><input type="text" id="ftpHost"></div>
        <div class="field" data-mode="ftp"><label for="ftpUser">FTP User</label><input type="text" id="ftpUser"></div>
        <div class="field"><label for="remotePath">Remote Path</label><input type="text" id="remotePath" placeholder="/home/user/project"></div>
        <div class="field"><label for="localPath">Local Path</label><input type="text" id="localPath" placeholder="/Users/you/project"></div>
        <div class="field" data-mode="sftp"><label for="identity">Identity File</label><input type="text" id="identity" placeholder="~/.ssh/id_rsa"></div>
        <div class="field"><label for="password">Password (stored securely)</label><input type="password" id="password" placeholder="leave empty to keep existing"></div>
        <div class="field"><label for="debounceMs">Debounce (ms)</label><input type="number" id="debounceMs" value="300"></div>
        <div class="field" data-mode="sftp"><label for="sshFlags">Extra SSH Flags</label><input type="text" id="sshFlags" placeholder="-o StrictHostKeyChecking=no"></div>
        <div class="field" data-mode="sftp,teleport"><label for="rsyncFlags">Extra Rsync Flags</label><input type="text" id="rsyncFlags" placeholder="--exclude .git"></div>
        <div class="actions">
            <button type="submit" id="btn-save">Save</button>
            <button type="button" id="teleport-login" data-mode="teleport">Login to Teleport</button>
            <button type="button" id="test-teleport" data-mode="teleport">Test Teleport</button>
            <button type="button" id="dry-run">Dry Run</button>
            <button type="button" id="sync-now">Sync Now</button>
        </div>
    </form>
    <div id="status"></div>
    <div id="loader">
        <div class="progress-outer">
            <div id="progress-bar" class="progress-bar"></div>
        </div>
        <div class="progress-label">Loading <span id="progress-percent">0%</span></div>
    </div>
    {{script}}
</body>
</html>
